# Installed as /etc/systemd/user/podman-auto-update.timer.d/sermon-studio.conf: every app's user looks for
# new images every 15 minutes (Podman's own is once a day). A new image that does not become healthy is
# rolled back (the containers' Notify=healthy).
[Timer]
OnCalendar=
OnCalendar=*:0/15
RandomizedDelaySec=60
