# Builds the image (go vet + all tests with ffmpeg run inside the build) and
# publishes it. Every main build gets a sortable main-<YYYYMMDDHHmmss UTC>-<sha>
# tag and the moving tag main, which the server's podman auto-update follows
# (deploy/, docs/hosting.md). The final stage is never taken from the cache, so
# every build installs Alpine's packages afresh, with their fixes (ffmpeg,
# whisper.cpp ...); Run workflow builds main again, for a fix without a change here.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*'] # a release: the image gets the version too
    paths-ignore: ['site/**'] # the website is not in the image (site.yml; Workers Builds deploys it)
  pull_request:
    branches: [main]
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # arm64's final stage (the check of ffmpeg's encoders) runs emulated; the Go build is cross-compiled
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gunnaringe/sermon-studio
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          # a cached apk add would keep the packages of the first build
          no-cache-filters: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
