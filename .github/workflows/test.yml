# go vet and all tests (with ffmpeg) on Windows and macOS. Linux is tested in the image build (image.yml).
# The object storage (package blob) against an S3 server, RustFS, on Linux.
name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['site/**'] # the website has its own check (site.yml)
  pull_request:
    branches: [main]
    paths-ignore: ['site/**']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x' # as the image build (golang:1.27)
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: ffmpeg -hide_banner -version
      - run: go vet ./...
      - run: go test ./...
        env:
          FFMPEG_REQUIRED: 1 # fail, not skip, when ffmpeg is not found

  blob:
    runs-on: ubuntu-latest
    services:
      s3:
        image: docker.io/rustfs/rustfs:1.0.6 # keep equal to scripts/lib.sh
        env:
          RUSTFS_ACCESS_KEY: testkey
          RUSTFS_SECRET_KEY: testsecret
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x' # as the image build (golang:1.27)
      - name: wait for the S3 server
        run: for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0; sleep 1; done; exit 1
      - run: go test -count=1 ./blob/ && go test -count=1 -run Blob ./cmd/sermon-studio/
        env:
          BLOB_TEST_ENDPOINT: http://127.0.0.1:9000
          BLOB_TEST_ACCESS_KEY: testkey
          BLOB_TEST_SECRET_KEY: testsecret
          BLOB_TEST_REQUIRED: 1
